<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>VYASA Security Report</title>
<style>
:root{
  --ink:#1a2230; --ink2:#44506a; --mut:#6b7891; --line:#e4e8ef; --bg:#eef1f6; --card:#ffffff;
  --navy:#16233f; --navy2:#223358; --accent:#2563eb;
  --crit:#d7263d; --high:#f4601a; --med:#e0a000; --low:#2d9cdb; --info:#7a8699; --ok:#17a673;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,"Segoe UI",Inter,system-ui,Roboto,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.55;font-size:15px}
.doc{max-width:980px;margin:0 auto;padding:26px 20px 80px}
a{color:var(--accent)}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;
  padding:11px 14px;margin-bottom:22px;box-shadow:0 6px 20px -10px rgba(20,35,60,.3)}
.toolbar .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 15px;font-size:13.5px;
  font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{border-color:#c7cfdd;background:#f7f9fc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1d4fd7}
.search{flex:1;min-width:150px;max-width:280px;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13.5px;outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2563eb22}

/* cover */
.cover{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:20px;padding:34px 34px 30px;
  position:relative;overflow:hidden;box-shadow:0 20px 50px -20px rgba(22,35,63,.6)}
.cover::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,160,255,.25),transparent 70%)}
.cover .brand{display:flex;align-items:center;gap:13px;position:relative;z-index:1}
.cover .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#4f8dff,#2563eb);
  display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 8px 20px -6px rgba(37,99,235,.6)}
.cover .brand h1{margin:0;font-size:19px;letter-spacing:.3px}
.cover .brand p{margin:2px 0 0;font-size:12.5px;color:#aebfe0}
.cover h2{position:relative;z-index:1;margin:22px 0 6px;font-size:27px;font-weight:800;letter-spacing:-.4px}
.cover .meta{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:22px;margin-top:16px;font-size:13px;color:#c4d1ea}
.cover .meta b{color:#fff;font-weight:600;display:block;font-size:14px;margin-top:2px}
.gradewrap{position:relative;z-index:1;margin-top:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.grade{font-size:40px;font-weight:900;line-height:1;padding:12px 20px;border-radius:16px;letter-spacing:-1px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.grade-tag{font-size:14px;font-weight:700;letter-spacing:.3px}
.grade-sub{font-size:12.5px;color:#c4d1ea;margin-top:3px;max-width:520px}

/* section */
.section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-top:20px;
  box-shadow:0 2px 10px -4px rgba(20,35,60,.08)}
.section h3{margin:0 0 4px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700}
.section h2{margin:0 0 14px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.lead{color:var(--ink2);font-size:15px}

/* scorecard */
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-top:4px}
.scard{border:1px solid var(--line);border-radius:13px;padding:15px 16px;background:#fbfcfe;text-align:center}
.scard .n{font-size:26px;font-weight:800;line-height:1}
.scard .l{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-top:5px;font-weight:600}
.sevbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:18px 0 10px;border:1px solid var(--line);background:#f0f2f6}
.sevbar i{display:block;height:100%}
.sevleg{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--ink2)}
.sevleg span{display:inline-flex;align-items:center;gap:6px}
.sevleg b{font-weight:700;color:var(--ink)}
.chip{width:11px;height:11px;border-radius:3px;display:inline-block}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 16px}
.fbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;
  cursor:pointer;color:var(--ink2);transition:.15s}
.fbtn:hover{border-color:#c7cfdd}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* finding */
.finding{border:1px solid var(--line);border-left-width:4px;border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff}
.finding .fh{display:flex;align-items:center;gap:13px;padding:15px 18px;cursor:pointer}
.finding .sev{font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:4px 10px;border-radius:7px;flex:none;color:#fff}
.finding .ft{font-weight:700;font-size:15px;flex:1;min-width:0}
.finding .fmeta{font-size:11.5px;color:var(--mut);font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.finding .chev{color:var(--mut);transition:transform .25s;flex:none}
.finding.open .chev{transform:rotate(90deg)}
.finding .fb{display:none;padding:2px 18px 18px;border-top:1px solid var(--line)}
.finding.open .fb{display:block}
.frow{margin-top:14px}
.frow .k{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.frow .v{font-size:14px;color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;background:#f1f4f9;border:1px solid var(--line);
  border-radius:7px;padding:4px 9px;color:var(--ink2)}
.fix{list-style:none;padding:0;margin:6px 0 0;counter-reset:s}
.fix li{position:relative;padding:7px 0 7px 32px;font-size:14px;color:var(--ink2);border-top:1px dashed var(--line)}
.fix li:first-child{border-top:0}
.fix li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:7px;width:21px;height:21px;border-radius:50%;
  background:#eaf0ff;color:var(--accent);font-size:11px;font-weight:800;display:grid;place-items:center}
.evi{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#0f1726;color:#c8e6d6;border-radius:10px;
  padding:13px 15px;white-space:pre-wrap;word-break:break-word;margin-top:6px;line-height:1.6}

/* generic table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;
  padding:9px 12px;border-bottom:2px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#f1f4f9;padding:1px 6px;border-radius:5px}
.vb{font-weight:700;font-size:11px;padding:2px 8px;border-radius:6px}
.vb.vuln{background:#fdeaec;color:var(--crit)} .vb.sec{background:#e5f6ef;color:var(--ok)}
.collapsed-wrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.muted{color:var(--mut)} .empty{color:var(--mut);font-style:italic;padding:12px 0}
.pathcard{border:1px solid var(--line);border-left:4px solid var(--crit);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.pathcard h4{margin:0 0 6px;font-size:15.5px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:26px;line-height:1.7}

/* ---- print / PDF ---- */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:11.5px}
  .doc{max-width:none;padding:0}
  .toolbar{display:none !important}
  .filters{display:none !important}
  .section,.cover,.finding,.pathcard{box-shadow:none !important}
  .cover{border-radius:0;color:#111;background:#fff !important;border:0;border-bottom:3px solid var(--navy);padding:0 0 16px}
  .cover .brand p,.cover .meta,.cover .grade-sub{color:#555}
  .cover .meta b,.cover h2,.cover .brand h1{color:#111}
  .cover::after{display:none}
  .cover .grade{background:#f2f4f8;border:1px solid #ccc;color:#111}
  .grade-tag{color:#111}
  .section{break-inside:avoid;border-radius:0;border:0;border-top:1px solid #ddd;padding:14px 0;margin-top:10px}
  .finding{break-inside:avoid;border-left-width:4px}
  .finding .fb{display:block !important}
  .finding .chev{display:none}
  .collapsed-wrap{max-height:none;overflow:visible;border:0}
  .evi{background:#f4f6f8;color:#111;border:1px solid #ddd}
  .toolbar,.search{display:none}
}
</style>
</head>
<body>
<div class="doc">

  <div class="toolbar">
    <input class="search" id="search" placeholder="Search findings…"/>
    <div class="sp"></div>
    <button class="btn" id="expandAll">Expand all</button>
    <button class="btn" onclick="location.href='/'">Dashboard</button>
    <button class="btn primary" id="pdfBtn">⤓ Download PDF</button>
  </div>

  <div id="root"><div class="section"><div class="lead">Loading report…</div></div></div>

  <div class="foot">
    Generated by <b>VYASA</b> — Autonomous AI Penetration Testing Platform · Authorized testing only.<br>
    This report is confidential and intended solely for the recipient.
  </div>
</div>

<script>
const SEV = { CRITICAL:{c:'var(--crit)',o:4}, HIGH:{c:'var(--high)',o:3}, MEDIUM:{c:'var(--med)',o:2}, LOW:{c:'var(--low)',o:1}, INFO:{c:'var(--info)',o:0} };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function gradeOf(c){
  if(c.CRITICAL) return {g:'F',tag:'CRITICAL RISK',col:'var(--crit)',sub:'Critical vulnerabilities require immediate remediation to prevent compromise.'};
  if(c.HIGH)     return {g:'D',tag:'HIGH RISK',col:'var(--high)',sub:'High-risk weaknesses should be resolved promptly to secure the application.'};
  if(c.MEDIUM)   return {g:'C',tag:'MODERATE RISK',col:'var(--med)',sub:'Core infrastructure is protected, but some issues should be addressed.'};
  if(c.LOW)      return {g:'B',tag:'LOW RISK',col:'var(--low)',sub:'No severe flaws detected — only minor hardening opportunities remain.'};
  return {g:'A+',tag:'EXCELLENT',col:'var(--ok)',sub:'All evaluated security tests passed cleanly. No weaknesses detected.'};
}

let REPORT=null, remByFinding={};

function reportId(){
  const m = location.pathname.match(/\/report\/([^\/?#]+)/);
  if(m) return decodeURIComponent(m[1]);
  const q = new URLSearchParams(location.search).get('id');
  return q || '';
}

async function load(){
  const id = reportId();
  let data=null;
  try{ data = await (await fetch('/api/reports/'+encodeURIComponent(id)+'/json')).json(); }
  catch(e){ document.getElementById('root').innerHTML='<div class="section"><h2>Report not found</h2><div class="lead">Could not load report <code>'+esc(id)+'</code>. Run a scan first, then open its report.</div></div>'; return; }
  REPORT=data;
  (data.remediation_roadmap||[]).forEach(r=>(r.target_finding_ids||[]).forEach(fid=>remByFinding[fid]=r));
  render(data);
}

function render(d){
  const findings=(d.findings||[]).slice().sort((a,b)=>(SEV[(b.severity||'INFO').toUpperCase()]?.o||0)-(SEV[(a.severity||'INFO').toUpperCase()]?.o||0));
  const counts={CRITICAL:0,HIGH:0,MEDIUM:0,LOW:0,INFO:0};
  findings.forEach(f=>{const s=(f.severity||'INFO').toUpperCase(); counts[s]=(counts[s]||0)+1;});
  const total=findings.length;
  const tele=d.investigation_telemetry||[];
  const totalChecks=tele.length||100;
  const passed=Math.max(0,totalChecks-total);
  const g=gradeOf(counts);
  const gen=d.generated_at?new Date(d.generated_at):null;
  const genStr=gen?gen.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'}):'—';

  const sevOrder=['CRITICAL','HIGH','MEDIUM','LOW','INFO'];
  const barSeg=sevOrder.map(s=>counts[s]?`<i style="width:${counts[s]/total*100}%;background:${SEV[s].c}"></i>`:'').join('');
  const leg=sevOrder.map(s=>`<span><i class="chip" style="background:${SEV[s].c}"></i>${s[0]+s.slice(1).toLowerCase()} <b>${counts[s]||0}</b></span>`).join('');

  const findHtml = total ? findings.map(f=>fcard(f)).join('') :
    `<div class="section" style="background:#e9f8f1;border-color:#bfe8d4"><h2 style="color:var(--ok)">🎉 No vulnerabilities found</h2><div class="lead">All ${totalChecks} evaluated security probes were handled safely by the target. No injection points, access bypasses, or data exposures were confirmed.</div></div>`;

  // assets + endpoints
  const assets=d.assets||[];
  const assetRows=assets.length?assets.map(a=>`<tr><td><code>${esc(a.host)}</code></td><td>${esc(a.ip||'—')}</td><td>${esc((a.open_ports||[]).join(', ')||'80/443')}</td><td>${esc((a.technologies||[]).join(', ')||'Standard web stack')}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No assets recorded.</td></tr>';
  let eps=[]; assets.forEach(a=>{(((a.metadata||{}).endpoints)||[]).forEach(e=>{if(typeof e==='object')eps.push(e);});});
  const epRows=eps.length?eps.map(e=>`<tr><td><code>${esc(e.path||'/')}</code></td><td>${esc((e.methods||['GET']).join(', '))}</td><td>${esc((e.params||[]).join(', ')||'—')}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">No endpoints catalogued.</td></tr>';

  // telemetry
  const teleRows=tele.length?tele.map(t=>`<tr><td><code>${esc(t.probe_id||'')}</code></td><td>${esc(t.category||'')}</td><td><code>${esc(t.endpoint||'/')}</code></td><td>${esc((t.response_summary||'').slice(0,60))}</td><td>${t.duration_ms?esc(t.duration_ms)+'ms':'—'}</td><td><span class="vb ${t.verdict==='VULNERABLE'?'vuln':'sec'}">${t.verdict==='VULNERABLE'?'VULNERABLE':'SECURE'}</span></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No probe telemetry.</td></tr>';

  // attack paths
  const paths=d.attack_paths||[];
  const pathHtml=paths.length?paths.map(p=>`<div class="pathcard"><h4>⚔️ ${esc(p.title)}</h4><div class="lead" style="font-size:13.5px">${esc(p.narrative||'')}</div><div class="frow"><div class="k">Business impact</div><div class="v">${esc(p.business_impact||'—')}</div></div><ol class="fix">${(p.steps||[]).map(s=>`<li><b>[${esc(s.technique||'step')}]</b> ${esc(s.action_taken||'')} → <i>${esc(s.impact||'')}</i></li>`).join('')}</ol></div>`).join(''):'';

  // remediation
  const rem=d.remediation_roadmap||[];
  const remRows=rem.length?rem.map(r=>`<tr><td><b>P${esc(r.priority)}</b></td><td><b>${esc(r.title)}</b></td><td>${esc(r.technical_action)}</td><td>${esc(r.strategic_recommendation)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Maintain current security posture with regular audits.</td></tr>';

  document.getElementById('root').innerHTML = `
    <div class="cover">
      <div class="brand"><div class="logo">V</div><div><h1>VYASA Security Assessment</h1><p>Autonomous AI Penetration Testing &amp; Threat Reasoning</p></div></div>
      <h2>Penetration Test Report</h2>
      <div class="meta">
        <div>Target Scope<b>${esc(d.target_scope||'—')}</b></div>
        <div>Report ID<b>${esc(d.report_id||'—')}</b></div>
        <div>Generated<b>${esc(genStr)}</b></div>
        <div>Findings<b>${total} confirmed</b></div>
      </div>
      <div class="gradewrap">
        <div class="grade" style="color:${g.col}">${g.g}</div>
        <div><div class="grade-tag" style="color:${g.col}">GRADE ${g.g} — ${g.tag}</div><div class="grade-sub">${g.sub}</div></div>
      </div>
    </div>

    <div class="section">
      <h3>01 · Executive Summary</h3>
      <h2>At-a-glance assessment</h2>
      <p class="lead">${esc(d.executive_summary||'')}</p>
      <div class="scards" style="margin-top:18px">
        <div class="scard"><div class="n" style="color:${g.col}">${g.g}</div><div class="l">Overall Grade</div></div>
        <div class="scard"><div class="n">${totalChecks}</div><div class="l">Checks Run</div></div>
        <div class="scard"><div class="n" style="color:var(--crit)">${counts.CRITICAL+counts.HIGH}</div><div class="l">Crit + High</div></div>
        <div class="scard"><div class="n" style="color:var(--med)">${counts.MEDIUM}</div><div class="l">Medium</div></div>
        <div class="scard"><div class="n" style="color:var(--ok)">${passed}</div><div class="l">Passed (${Math.round(passed/Math.max(totalChecks,1)*100)}%)</div></div>
      </div>
      ${total?`<div class="sevbar">${barSeg}</div><div class="sevleg">${leg}</div>`:''}
    </div>

    <div class="section">
      <h3>02 · Findings &amp; Evidence</h3>
      <h2>${total} confirmed ${total===1?'finding':'findings'}</h2>
      <div class="filters" id="filters">
        <button class="fbtn on" data-f="ALL">All ${total}</button>
        ${sevOrder.filter(s=>counts[s]).map(s=>`<button class="fbtn" data-f="${s}"><i class="chip" style="background:${SEV[s].c}"></i>&nbsp;${s[0]+s.slice(1).toLowerCase()} ${counts[s]}</button>`).join('')}
      </div>
      <div id="findings">${findHtml}</div>
    </div>

    ${paths.length?`<div class="section"><h3>03 · Attack Paths</h3><h2>Correlated kill chains</h2>${pathHtml}</div>`:''}

    <div class="section">
      <h3>${paths.length?'04':'03'} · Remediation Roadmap</h3>
      <h2>Prioritized fixes</h2>
      <table class="tbl"><thead><tr><th>Priority</th><th>Action item</th><th>What to do</th><th>Why it matters</th></tr></thead><tbody>${remRows}</tbody></table>
    </div>

    <div class="section">
      <h3>${paths.length?'05':'04'} · Scope &amp; Infrastructure</h3>
      <h2>Discovered assets &amp; endpoints</h2>
      <table class="tbl"><thead><tr><th>Host</th><th>IP</th><th>Open ports</th><th>Technology</th></tr></thead><tbody>${assetRows}</tbody></table>
      <div style="height:18px"></div>
      <table class="tbl"><thead><tr><th>Endpoint</th><th>Methods</th><th>Parameters</th></tr></thead><tbody>${epRows}</tbody></table>
    </div>

    <div class="section">
      <h3>${paths.length?'06':'05'} · Execution Log</h3>
      <h2>Probe telemetry <span class="muted" style="font-size:13px;font-weight:500">(${tele.length} probes)</span></h2>
      <div class="collapsed-wrap"><table class="tbl"><thead><tr><th>Probe</th><th>Category</th><th>Endpoint</th><th>Response</th><th>Speed</th><th>Verdict</th></tr></thead><tbody>${teleRows}</tbody></table></div>
    </div>
  `;
  wire();
}

function fcard(f){
  const s=(f.severity||'INFO').toUpperCase(); const col=SEV[s]?.c||'var(--info)';
  const rem=remByFinding[f.finding_id];
  const why = rem?.strategic_recommendation || 'Addressing this issue reduces overall risk and prevents potential unauthorized access.';
  const fixText = rem?.technical_action || 'Review the technical evidence and apply recommended web security best practices.';
  const fixSteps = fixText.split(/(?<=\.)\s+(?=[A-Z])/).filter(x=>x.trim().length>3);
  const tags=[];
  if(f.asset_id) tags.push('Asset: '+f.asset_id);
  if(f.port) tags.push('Port: '+f.port);
  if(f.cve_id) tags.push(f.cve_id);
  if(f.cvss_score!=null) tags.push('CVSS '+f.cvss_score);
  if(f.service) tags.push(f.service);
  return `<div class="finding" data-sev="${s}" style="border-left-color:${col}">
    <div class="fh" onclick="this.parentNode.classList.toggle('open')">
      <span class="sev" style="background:${col}">${s}</span>
      <span class="ft">${esc(f.title)}</span>
      <span class="fmeta">${esc(f.finding_id||'')}</span>
      <span class="chev">▸</span>
    </div>
    <div class="fb">
      <div class="frow"><div class="k">What this means</div><div class="v">${esc(f.description||'A security check identified an opportunity to strengthen defenses.')}</div></div>
      <div class="frow"><div class="k">Why it matters</div><div class="v">${esc(why)}</div></div>
      <div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="frow"><div class="k">How to fix</div><ol class="fix">${fixSteps.map(x=>`<li>${esc(x.trim())}</li>`).join('')}</ol></div>
      ${f.evidence?`<div class="frow"><div class="k">Proof of concept (evidence)</div><div class="evi">${esc(f.evidence)}</div></div>`:''}
    </div>
  </div>`;
}

function wire(){
  const fbtns=[...document.querySelectorAll('#filters .fbtn')];
  fbtns.forEach(b=>b.onclick=()=>{ fbtns.forEach(x=>x.classList.remove('on')); b.classList.add('on'); applyFilter(); });
  document.getElementById('search').oninput=applyFilter;
  const ea=document.getElementById('expandAll');
  ea.onclick=()=>{ const cards=[...document.querySelectorAll('.finding')]; const anyClosed=cards.some(c=>!c.classList.contains('open'));
    cards.forEach(c=>c.classList.toggle('open',anyClosed)); ea.textContent=anyClosed?'Collapse all':'Expand all'; };
}
function applyFilter(){
  const sel=(document.querySelector('#filters .fbtn.on')||{}).dataset?.f||'ALL';
  const q=(document.getElementById('search').value||'').toLowerCase();
  document.querySelectorAll('.finding').forEach(c=>{
    const okSev = sel==='ALL' || c.dataset.sev===sel;
    const okQ = !q || c.textContent.toLowerCase().includes(q);
    c.style.display=(okSev&&okQ)?'':'none';
  });
}
document.getElementById('pdfBtn').onclick=()=>window.print();
load();
</script>
</body>
</html>
