# VYASA Platform Configuration

platform:
  name: "VYASA"
  version: "0.1.0"
  mode: "authorized_audit"

llm:
  # Default to local LM Studio / Bionic endpoint
  base_url: "http://127.0.0.1:1234/v1"
  api_key: "lm-studio"
  model: "nvidia/nemotron-3-nano-4b"
  temperature: 0.2
  max_tokens: 2048
  timeout_seconds: 120

recon:
  subdomain_enumeration: true
  port_scan: true
  top_ports: 1000
  tech_detection: true
  timeout_seconds: 180

testing:
  active_probing: true
  safe_mode: true  # Prevents intrusive DoS / payload execution
  max_parallel_scans: 4

reasoning:
  max_correlation_depth: 4
  enable_chain_of_thought: true
  min_path_confidence: 0.70

reporting:
  output_format: ["markdown", "json"]
  output_dir: "./reports"
  include_attack_graph_diagrams: true
